# Formal Requirements Matrix for Megathon 2026 Multi-Modal Drone Detection Platform
metadata:
  system: "Multi-Modal Drone Detection Platform"
  version: "1.0.0"
  last_updated: "2026-09-11"

requirements:
  - id: "FR-001"
    title: "RF Drone Binary Classification"
    type: "FUNCTIONAL"
    description: "RF signal baseband windows can be classified as DRONE or NON-DRONE."
    validation_method: "Automated Unit Test & Inference Execution"
    linked_test: "tests/test_model_artifacts.py"
    status: "VERIFIED"

  - id: "FR-002"
    title: "RF Input Schema Validation"
    type: "CONSTRAINT"
    description: "RF raw input must contain exactly 300 numerical features (150 I/Q pairs) without NaN or Inf values."
    validation_method: "Automated Unit Test"
    linked_test: "tests/test_rf_input_validation.py"
    status: "VERIFIED"

  - id: "FR-003"
    title: "Canonical Complex Baseband Preprocessing"
    type: "MODEL"
    description: "Raw interleaved I/Q signals must be converted to complex baseband (z = I + jQ) and transformed to a deterministic 3-channel representation (log_magnitude, cos_phase, sin_phase) of shape (N, 150, 3)."
    validation_method: "Mathematical Property Test"
    linked_test: "tests/test_preprocessing.py"
    status: "VERIFIED"

  - id: "FR-004"
    title: "Real-Time RF Inference API"
    type: "FUNCTIONAL"
    description: "Inference engine must output classification label, calibrated probability, threshold, and modality metadata."
    validation_method: "End-to-End API Test"
    linked_test: "tests/test_rf_input_validation.py"
    status: "VERIFIED"

  - id: "FR-005"
    title: "Optical Vision Target Detection"
    type: "FUNCTIONAL"
    description: "Computer vision engine can detect aerial targets and discriminate drones from birds and commercial aircraft."
    validation_method: "Vision Benchmark Evaluation"
    linked_test: "src/vision/optical_validation.py"
    status: "VERIFIED"

  - id: "FR-006"
    title: "Radar Kinematic Tracking Abstraction"
    type: "FUNCTIONAL"
    description: "Radar abstraction tracks airborne targets (range, velocity, track history) and explicitly declares simulation source."
    validation_method: "Interface Compliance Test"
    linked_test: "src/radar/radar_simulator.py"
    status: "VERIFIED"

  - id: "FR-007"
    title: "Heterogeneous Evidence Fusion"
    type: "FUNCTIONAL"
    description: "Fusion module ingests Radar, Vision, and RF evidence, outputting a consolidated decision with agreement score."
    validation_method: "Multi-Modal Fusion Ablation Test"
    linked_test: "src/fusion/fusion_ablation.py"
    status: "VERIFIED"

  - id: "FR-008"
    title: "Three-State Decision Engine"
    type: "FUNCTIONAL"
    description: "System outputs DRONE, NON-DRONE, or UNCERTAIN when sensor evidence is conflicting or insufficient."
    validation_method: "Conflict Resolution Scenario Test"
    linked_test: "src/fusion/fusion_ablation.py"
    status: "VERIFIED"

  - id: "NFR-001"
    title: "Inference Latency Target"
    type: "PERFORMANCE"
    description: "Single-sample RF inference latency must be under 5.0 ms on standard CPU hardware."
    validation_method: "Performance Benchmark Benchmark"
    linked_test: "src/evaluate.py"
    status: "VERIFIED"

  - id: "NFR-002"
    title: "Deterministic Reproducibility"
    type: "NON_FUNCTIONAL"
    description: "All training, evaluation, and inference pipelines must be completely deterministic and seed-controlled."
    validation_method: "Parity Verification Test"
    linked_test: "tests/test_preprocessing.py"
    status: "VERIFIED"

  - id: "SEC-001"
    title: "Safe Input Deserialization"
    type: "SECURITY"
    description: "Model loading and inference must not execute arbitrary untrusted pickle code without strict schema verification."
    validation_method: "Security Audit"
    linked_test: "tests/test_model_artifacts.py"
    status: "VERIFIED"
